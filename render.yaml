services:
  - type: web
    name: ai-tutor-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Rewrite (not redirect) so the browser URL stays as-is and React
      # Router handles it client-side — a 301/302 redirect would instead
      # bounce every deep link back to "/".
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: ai-tutor-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AITUNNEL_API_KEY
        sync: false
      - key: AITUNNEL_MODEL
        value: claude-sonnet-4.5
      - key: AITUNNEL_QUIZ_MODEL
        value: deepseek-v4-flash
      - key: AITUNNEL_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGIN
        sync: false
